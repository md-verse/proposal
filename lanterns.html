<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Question in the Stars...</title>
    <link rel="stylesheet" href="lanterns.css">
    <!-- Elegant romantic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lato:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="lantern-sky"></canvas>
    
    <main class="proposal-container" id="proposal-box">
        <h1 class="calligraphy fade-in">You are my light...</h1>
        <p class="subtitle fade-in delay-1">Will you be my girlfriend and illuminate the rest of my days?</p>
        
        <div class="actions fade-in delay-2">
            <button id="btn-yes">Yes, forever</button>
            <button id="btn-no">No</button>
        </div>
    </main>

    <section class="success-screen hidden" id="success-box">
        <h1 class="calligraphy gold-glow reveal-up">And at last I see the light. ✨</h1>
    </section>

    <script src="lanterns.js"></script>
</body>
</html>
