<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under the Moon...</title>
    <link rel="stylesheet" href="sakura.css">
    <!-- Elegant, poetic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="sakura-canvas"></canvas>
    
    <main class="frosted-glass" id="proposal-box">
        <h1 class="poetic-title fade-in">My beautiful serendipity...</h1>
        <p class="subtitle fade-in delay-1">Will you do me the absolute honor of being my girlfriend?</p>
        
        <div class="actions fade-in delay-2">
            <button id="btn-yes">Yes, I'm yours</button>
            <button id="btn-no">No</button>
        </div>
    </main>

    <section class="success-screen hidden" id="success-box">
        <h1 class="poetic-title rose-glow reveal-up">Our story begins. 🌸</h1>
    </section>

    <script src="sakura.js"></script>
</body>
</html>
