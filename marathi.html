<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>माझं प्रेम...</title>
    <link rel="stylesheet" href="marathi.css">
    <!-- Optimized font for Marathi (Devanagari) -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="rain-canvas"></canvas>
    
    <main class="glass-panel" id="proposal-box">
        <h1 class="marathi-title fade-in">माझ्या आयुष्यातील सर्वात सुंदर स्वप्न तू आहेस...</h1>
        <p class="subtitle fade-in delay-1">आपण आपल्या नात्याला एक नवीन सुरुवात देऊया का?<br>तू आयुष्यभर माझी साथ देशील का?</p>
        
        <div class="actions fade-in delay-2">
            <button id="btn-yes">हो, नक्कीच ❤️</button>
            <button id="btn-no">नाही</button>
        </div>
    </main>

    <section class="success-screen hidden" id="success-box">
        <h1 class="marathi-title warm-glow reveal-up">माझं जग सुंदर बनवल्याबद्दल धन्यवाद! ✨</h1>
        <p class="subtitle">आपला प्रवास आता खऱ्या अर्थाने सुरू झाला आहे.</p>
    </section>

    <script src="marathi.js"></script>
</body>
</html>
