<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Question For You...</title>
    <link rel="stylesheet" href="style.css">
    <!-- Elegant, cinematic fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <!-- The magical particle background -->
    <canvas id="magical-realm"></canvas>
    
    <main class="cinematic-card" id="proposal-box">
        <div class="content-wrapper">
            <h1 class="fade-in-text">Will you be my girlfriend?</h1>
            <p class="subtitle fade-in-text delay-1">Every moment with you feels like magic. Let's start our next chapter.</p>
            
            <div class="actions fade-in-text delay-2">
                <button id="btn-yes">Yes, a thousand times</button>
                <button id="btn-no">No</button>
            </div>
        </div>
    </main>

    <section class="success-screen hidden" id="success-box">
        <div class="glow-wrapper">
            <h1 class="glowing-text">It's official. ✨</h1>
            <p class="subtitle">The best is yet to come.</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
